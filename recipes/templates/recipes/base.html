<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}The Recipe Box{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        terracotta: {
                            50: '#fdf3ee', 100: '#fbe3d5', 400: '#e8a37e',
                            500: '#d97a56', 600: '#b85c3c', 700: '#9c4a30',
                        },
                        sage: {
                            50: '#f3f5f1', 100: '#e6ebe1', 400: '#a5b89a',
                            500: '#7a8c6e', 600: '#647357',
                        },
                        cream: '#fbf5ee',
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-cream text-stone-800 min-h-screen flex flex-col">
    <header class="sticky top-0 z-10 bg-white/90 backdrop-blur border-b border-stone-200">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between gap-6 flex-wrap">
            <a href="{% url 'recipe_list' %}" class="text-xl font-bold text-terracotta-600 flex items-center gap-2">
                <span>🍲</span> The Recipe Box
            </a>
            <form method="get" action="{% url 'recipe_list' %}" class="flex gap-2">
                <input type="text" name="q" placeholder="Search recipes…" value="{{ query|default:'' }}"
                       class="rounded-full border border-stone-200 bg-cream px-4 py-2 text-sm w-56 focus:outline-none focus:ring-2 focus:ring-terracotta-500">
                <button type="submit" class="rounded-full bg-terracotta-500 hover:bg-terracotta-600 text-white font-semibold px-5 py-2 text-sm transition">
                    Search
                </button>
            </form>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-10 flex-1 w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-stone-200 text-stone-500 text-sm">
        <div class="max-w-5xl mx-auto px-6 py-6">Made with Django &mdash; a home-cooking recipe box.</div>
    </footer>
</body>
</html>
